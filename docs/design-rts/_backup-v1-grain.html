<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>粮库规则中心 — Rule Team Server 原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%230f62fe'/%3E%3Ctext x='8' y='12' text-anchor='middle' fill='white' font-size='10' font-family='sans-serif' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E" />
<style>
/* ============ Design tokens (IBM Carbon inspired) ============ */
:root{
  --blue:#0f62fe; --blue-hover:#0353e9; --blue-active:#0043ce;
  --blue-bg:#edf5ff;
  --gray-10:#f4f4f4; --gray-20:#e0e0e0; --gray-30:#c6c6c6;
  --gray-50:#8d8d8d; --gray-70:#525252; --gray-100:#262626;
  --green:#24a148; --green-bg:#defbe6;
  --red:#da1e28; --red-bg:#fff1f1;
  --yellow:#f1c21b; --yellow-bg:#fff8db;
  --purple:#8a3ffc; --purple-bg:#f6f2ff;
  --side-w:280px; --top-h:48px; --status-h:32px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:13px;color:var(--gray-100);background:var(--gray-10);overflow:hidden;line-height:1.5}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--blue);text-decoration:none}

/* ============ Top bar ============ */
.topbar{height:var(--top-h);background:var(--gray-100);color:#fff;display:flex;align-items:center;padding:0 16px;gap:24px;flex-shrink:0}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.topbar .brand .logo{width:24px;height:24px;background:var(--blue);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.topnav{display:flex;gap:4px;height:100%}
.topnav button{color:#c6c6c6;padding:0 16px;height:100%;border-bottom:3px solid transparent;font-size:13px}
.topnav button:hover{color:#fff}
.topnav button.active{color:#fff;border-bottom-color:var(--blue);background:#000}
.topbar .spacer{flex:1}
.topbar .search{background:#393939;border:none;color:#fff;padding:6px 12px;border-radius:3px;width:280px;font-size:12px}
.topbar .search::placeholder{color:#a8a8a8}
.topbar .icon-btn{color:#c6c6c6;padding:6px;border-radius:3px;position:relative}
.topbar .icon-btn:hover{color:#fff;background:#393939}
.topbar .avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

/* ============ Layout shell ============ */
.shell{display:flex;height:calc(100vh - var(--top-h) - var(--status-h))}
.sidebar{width:var(--side-w);background:#fff;border-right:1px solid var(--gray-20);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--gray-10)}
.statusbar{height:var(--status-h);background:#fff;border-top:1px solid var(--gray-20);display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;color:var(--gray-70)}

/* ============ Sidebar ============ */
.side-project{padding:12px 16px;border-bottom:1px solid var(--gray-20);background:var(--gray-10)}
.side-project .label{font-size:10px;color:var(--gray-50);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.side-project .name{font-weight:600;font-size:13px}
.side-project .branch{font-size:11px;color:var(--gray-50);margin-top:2px}
.side-tabs{display:flex;border-bottom:1px solid var(--gray-20)}
.side-tabs button{flex:1;padding:8px 0;font-size:11px;color:var(--gray-70);border-bottom:2px solid transparent}
.side-tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.tree{flex:1;overflow:auto;padding:8px 0;font-size:12.5px}
.tree .node{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;color:var(--gray-100)}
.tree .node:hover{background:var(--gray-10)}
.tree .node.active{background:var(--blue-bg);color:var(--blue);border-right:2px solid var(--blue)}
.tree .node .twist{width:12px;color:var(--gray-50);font-size:9px}
.tree .node .ico{color:var(--gray-50);width:14px;text-align:center}
.tree .node .badge{margin-left:auto;font-size:10px;background:var(--gray-20);color:var(--gray-70);padding:0 6px;border-radius:8px}
.tree .node .badge.draft{background:var(--yellow-bg);color:#8a6100}
.tree .indent{padding-left:28px}
.tree .indent2{padding-left:44px}

/* ============ Main content ============ */
.content{flex:1;overflow:auto;padding:20px 24px}
.crumb{font-size:11px;color:var(--gray-50);margin-bottom:12px}
.crumb b{color:var(--gray-100);font-weight:500}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:18px;font-weight:600}
.page-head .sub{font-size:12px;color:var(--gray-50);margin-top:2px}
.btn{padding:6px 14px;border-radius:3px;font-size:12px;font-weight:400;border:1px solid var(--gray-30);background:#fff;color:var(--gray-100)}
.btn:hover{background:var(--gray-10)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:var(--blue-hover)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 10px;font-size:11px}
.btn-row{display:flex;gap:8px}

/* ============ Cards / tiles (Library) ============ */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tile{background:#fff;border:1px solid var(--gray-20);border-radius:4px;padding:16px;cursor:pointer;transition:box-shadow .15s}
.tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:var(--gray-30)}
.tile .t-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tile .t-icon{width:36px;height:36px;border-radius:4px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center}
.tile h3{font-size:14px;font-weight:600}
.tile .t-meta{font-size:11px;color:var(--gray-50)}
.tile .t-stats{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-10)}
.tile .t-stats div{font-size:11px;color:var(--gray-70)}
.tile .t-stats b{display:block;font-size:16px;color:var(--gray-100);font-weight:600}

/* ============ Home ============ */
.home-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.panel{background:#fff;border:1px solid var(--gray-20);border-radius:4px}
.panel .p-head{padding:12px 16px;border-bottom:1px solid var(--gray-20);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.panel .p-body{padding:8px 0}
.act{display:flex;gap:12px;padding:10px 16px;align-items:center;border-bottom:1px solid var(--gray-10)}
.act:last-child{border-bottom:none}
.act .a-ico{width:28px;height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act .a-body{flex:1;min-width:0}
.act .a-title{font-size:12.5px}
.act .a-meta{font-size:11px;color:var(--gray-50)}

/* ============ Rule editor (BAL) ============ */
.editor-card{background:#fff;border:1px solid var(--gray-20);border-radius:4px;overflow:hidden}
.editor-tabs{display:flex;background:var(--gray-10);border-bottom:1px solid var(--gray-20);padding:0 8px;overflow-x:auto}
.editor-tabs .tab{padding:8px 14px;font-size:12px;color:var(--gray-70);border-right:1px solid var(--gray-20);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;background:#fff;border-top:2px solid transparent}
.editor-tabs .tab.active{border-top-color:var(--blue);color:var(--blue)}
.editor-tabs .tab .x{color:var(--gray-50);font-size:10px}
.editor-meta{padding:12px 20px;border-bottom:1px solid var(--gray-20);display:flex;gap:24px;font-size:12px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:10px;font-weight:500}
.tag.draft{background:var(--yellow-bg);color:#8a6100}
.tag.published{background:var(--green-bg);color:#04752f}
.tag.breach{background:var(--red-bg);color:#c0141f}
.tag.info{background:var(--blue-bg);color:#0043ce}
.bal{padding:24px 28px;font-size:14px;line-height:2.2;min-height:300px}
.bal .kw{color:var(--purple);font-weight:500}
.bal .subject{color:var(--gray-50);font-size:12px;margin-bottom:8px}
.bal .clause{display:flex;gap:8px;align-items:baseline;margin:4px 0 4px 24px}
.bal .clause .indent{color:var(--gray-50)}
.pill{display:inline-block;padding:2px 10px;border-radius:3px;background:var(--blue-bg);color:var(--blue);cursor:pointer;border:1px dashed var(--blue);font-size:13px}
.pill:hover{background:#d0e2ff}
.pill.value{background:#fff;color:var(--gray-100);border-style:solid;border-color:var(--gray-30);font-family:var(--mono);font-size:12px}
.pill.value:hover{border-color:var(--blue)}
.editor-foot{padding:12px 20px;background:var(--gray-10);border-top:1px solid var(--gray-20);display:flex;justify-content:space-between;align-items:center}

/* ============ Decision table ============ */
.dt{background:#fff;border:1px solid var(--gray-20);overflow:auto}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border:1px solid var(--gray-20);padding:6px 10px;text-align:left;vertical-align:middle}
table.grid th{background:var(--gray-10);font-weight:600;font-size:11px;color:var(--gray-70)}
table.grid td input{border:none;outline:none;width:100%;font-size:12px;background:transparent}
table.grid td input:focus{background:var(--blue-bg)}
table.grid .cond{background:#fafafa}
table.grid .action{background:var(--green-bg)}
table.grid .row-num{width:36px;text-align:center;color:var(--gray-50);background:var(--gray-10);user-select:none}
table.grid tr:hover td{background:#f0f6ff}
table.grid tr:hover td.cond{background:#f0f0f0}

/* ============ Release / RES tables ============ */
.data-table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
.data-table th{background:var(--gray-10);text-align:left;padding:10px 12px;font-weight:600;font-size:11px;color:var(--gray-70);border-bottom:1px solid var(--gray-20)}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--gray-10)}
.data-table tr:hover td{background:var(--blue-bg)}
.data-table .ver{font-family:var(--mono);color:var(--blue)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.running{background:var(--green)}
.status-dot.stopped{background:var(--gray-50)}
.status-dot.error{background:var(--red)}

/* ============ BOM view ============ */
.bom-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bom-list{background:#fff;border:1px solid var(--gray-20);border-radius:4px}
.bom-list h3{padding:12px 16px;border-bottom:1px solid var(--gray-20);font-size:13px}
.bom-item{padding:10px 16px;border-bottom:1px solid var(--gray-10);display:flex;align-items:center;gap:10px}
.bom-item:last-child{border-bottom:none}
.bom-item .key{font-family:var(--mono);font-size:12px;font-weight:500}
.bom-item .type{font-size:10px;padding:1px 6px;background:var(--gray-10);border-radius:3px;color:var(--gray-70)}
.bom-item .dir{margin-left:auto;font-size:10px;color:var(--gray-50)}

/* ============ Flow view ============ */
.flow-canvas{background:#fff;border:1px solid var(--gray-20);border-radius:4px;height:560px;position:relative;overflow:hidden;background-image:radial-gradient(circle,#e0e0e0 1px,transparent 1px);background-size:20px 20px}
.flow-node{position:absolute;background:#fff;border:1.5px solid var(--blue);border-radius:4px;padding:8px 14px;font-size:12px;min-width:140px;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.flow-node .n-title{font-weight:600;font-size:12px}
.flow-node .n-sub{font-size:10px;color:var(--gray-50)}
.flow-node.gate{border-color:var(--yellow);background:#fffbe6;border-radius:20px}
.flow-node.end{border-color:var(--green);background:var(--green-bg)}

/* ============ Status bar ============ */
.statusbar .ok{color:var(--green)}
.statusbar .warn{color:#b28600}

/* ============ Toast ============ */
.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--gray-100);color:#fff;padding:10px 20px;border-radius:4px;font-size:12px;z-index:99;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

/* ============ Empty view ============ */
.view{display:none}
.view.active{display:block}

@media(max-width:900px){
  .sidebar{display:none}
  .home-grid{grid-template-columns:1fr}
  .bom-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ===================== TOP BAR ===================== -->
<header class="topbar">
  <div class="brand"><div class="logo">R</div> 粮库规则中心</div>
  <nav class="topnav">
    <button data-nav="home" class="active">主页</button>
    <button data-nav="library">库</button>
    <button data-nav="work">工作项</button>
  </nav>
  <div class="spacer"></div>
  <input class="search" placeholder="搜索规则、决策表、BOM 属性…" />
  <button class="icon-btn" title="通知">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
  </button>
  <div class="avatar">WL</div>
</header>

<div class="shell">
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="side-project" id="sideProject">
      <div class="label">当前决策服务</div>
      <div class="name">粮库温控告警决策服务</div>
      <div class="branch">分支 main · 基线 v1.2.0</div>
    </div>
    <div class="side-tabs">
      <button class="active">决策资产</button>
      <button>搜索</button>
      <button>回收站</button>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main">
    <div class="content" id="content">
      <!-- views injected here -->
    </div>
  </main>
</div>

<!-- ===================== STATUS BAR ===================== -->
<footer class="statusbar">
  <span>版本 <b class="ver">v1.2.3</b></span>
  <span>作者 wallace</span>
  <span>状态 <span class="tag draft">草稿</span></span>
  <span>编译 <span class="ok">● 通过</span></span>
  <span>规则集 <b>temperature-alarm</b></span>
  <span style="margin-left:auto">Drools 10.2.0 · RES @ 8790</span>
</footer>

<div class="toast" id="toast"></div>

<script>
// ===================== Data model (dograin scenario) =====================
const RULES = [
  {id:'q01', pkg:'数据质量', name:'缺测率过高不可判定', type:'rule', status:'published', ver:'1.2'},
  {id:'q02', pkg:'数据质量', name:'测点陈旧标记', type:'rule', status:'draft', ver:'0.3'},
  {id:'t01', pkg:'整仓均温', name:'整仓均温超限告警', type:'table', status:'published', ver:'1.5'},
  {id:'t02', pkg:'整仓均温', name:'均温恢复候选', type:'rule', status:'published', ver:'1.1'},
  {id:'m01', pkg:'最高温', name:'单点最高温超限', type:'rule', status:'published', ver:'1.0'},
  {id:'l01', pkg:'分层超限', name:'各层温度阈值', type:'table', status:'draft', ver:'0.4'},
  {id:'h01', pkg:'历史升温', name:'历史均温升高', type:'rule', status:'published', ver:'0.9'},
  {id:'r01', pkg:'恢复判定', name:'恢复回差与持续时间', type:'table', status:'published', ver:'1.3'},
  {id:'n01', pkg:'通知升级', name:'未确认告警升级', type:'rule', status:'archived', ver:'0.2'},
];
const PKGS = ['数据质量','整仓均温','最高温','分层超限','历史升温','恢复判定','通知升级'];

// ===================== Router =====================
const $ = s => document.querySelector(s);
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function nav(view){
  document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));
  if(view==='home') renderHome();
  else if(view==='library') renderLibrary();
  else if(view==='work') renderWork();
  // sidebar visibility
  $('#sideProject').style.display = (view==='home'||view==='library')?'none':'block';
}
document.querySelectorAll('.topnav button').forEach(b=>b.onclick=()=>nav(b.dataset.nav));

// ===================== Sidebar tree =====================
function renderTree(){
  const tree=$('#tree');
  let html='';
  PKGS.forEach((p,i)=>{
    const items=RULES.filter(r=>r.pkg===p);
    html+=`<div class="node" onclick="togglePkg(this)"><span class="twist">▾</span><span class="ico">📁</span><b>${p}</b><span class="badge">${items.length}</span></div>`;
    items.forEach(r=>{
      const icon=r.type==='table'?'▦':'≡';
      const cls=r.status==='archived'?' style="opacity:.4"':'';
      html+=`<div class="node indent" onclick="openRule('${r.id}')" ${cls}><span class="twist"></span><span class="ico">${icon}</span>${r.name}<span class="badge ${r.status}">${r.ver}</span></div>`;
    });
  });
  html+=`<div style="border-top:1px solid var(--gray-20);margin:8px 0"></div>`;
  html+=`<div class="node" onclick="showView('bom')"><span class="twist"></span><span class="ico">◧</span>字段模型 BOM</div>`;
  html+=`<div class="node" onclick="showView('flow')"><span class="twist"></span><span class="ico">⬡</span>规则集</div>`;
  html+=`<div class="node" onclick="showView('releases')"><span class="twist"></span><span class="ico">⬆</span>发布中心</div>`;
  html+=`<div class="node" onclick="showView('res')"><span class="twist"></span><span class="ico">▶</span>RES 控制台</div>`;
  tree.innerHTML=html;
}
function togglePkg(el){
  const twist=el.querySelector('.twist');
  twist.textContent = twist.textContent==='▾'?'▸':'▾';
  let n=el.nextElementSibling;
  while(n && !n.classList.contains('node') || (n.querySelector('.twist') && n.querySelector('.twist').textContent!=='')){
    if(n.matches('.indent')) n.style.display = twist.textContent==='▾'?'':'none';
    if(n.matches('.indent2')) n.style.display = twist.textContent==='▾'?'':'none';
    n=n.nextElementSibling;
  }
}

// ===================== Views =====================
function showView(name){
  renderTree();
  const c=$('#content');
  if(name==='home') return nav('home');
  if(name==='library') return nav('library');
  if(name==='bom') return renderBom(c);
  if(name==='flow') return renderFlow(c);
  if(name==='releases') return renderReleases(c);
  if(name==='res') return renderRes(c);
}

function renderHome(){
  $('#sideProject').style.display='none';
  $('#content').innerHTML=`
    <div class="crumb">主页</div>
    <h1 style="font-size:20px;margin-bottom:16px">早上好，wallace</h1>
    <div class="home-grid">
      <div class="panel">
        <div class="p-head">最近活动 <button class="btn sm">查看全部</button></div>
        <div class="p-body">
          <div class="act"><div class="a-ico" style="background:var(--green-bg);color:var(--green)">⬆</div><div class="a-body"><div class="a-title">均温超限告警 v1.5 已发布到 Production</div><div class="a-meta">陈保管员 · 2 小时前</div></div></div>
          <div class="act"><div class="a-ico" style="background:var(--yellow-bg);color:#8a6100">✎</div><div class="a-body"><div class="a-title">分层温度阈值表修改了 3 行（草稿）</div><div class="a-meta">你 · 昨天 18:42</div></div></div>
          <div class="act"><div class="a-ico" style="background:var(--red-bg);color:var(--red)">!</div><div class="a-body"><div class="a-title">RES 部署 temperature-alarm v1.2.2 失败：Drools 编译错误</div><div class="a-meta">系统 · 昨天 14:10</div></div></div>
          <div class="act"><div class="a-ico" style="background:var(--blue-bg);color:var(--blue)">↻</div><div class="a-body"><div class="a-title">影子运行报告：v1.2.2 vs v1.2.1，差异 3 条</div><div class="a-meta">系统 · 2 天前</div></div></div>
        </div>
      </div>
      <div>
        <div class="panel" style="margin-bottom:16px">
          <div class="p-head">我关注的规则</div>
          <div class="p-body">
            <div class="act"><div class="a-body"><div class="a-title">整仓均温超限告警</div><div class="a-meta">整仓均温 · <span class="tag published">已发布 v1.5</span></div></div></div>

  // BAL rule editor
  c.innerHTML=`
    <div class="crumb">${r.pkg} / <b>${r.name}</b></div>
    <div class="page-head">
      <div><h1>${r.name}</h1><div class="sub">规则 ID: ${r.id} · 创建于 2026-08-12 · 最近修改 2026-09-28</div></div>
      <div class="btn-row"><button class="btn">试运行</button><button class="btn">保存草稿</button><button class="btn primary">提交发布</button></div>
    </div>

      <div class="editor-tabs">
        <div class="tab active">${r.name} <span class="x">✕</span></div>

      </div>
      <div class="editor-meta">
        <span class="tag ${r.status}">${r.status==='published'?'已发布':'草稿'}</span>
        <span>版本 <b>v${r.ver}</b></span>

        <span>命中策略: <b>COLLECT</b></span>

        <div class="clause"><span class="indent">并且</span> <span class="pill">有效测点覆盖率</span> <span class="pill value">≥</span> <span class="pill value">90</span> <span class="pill">%</span></div>
