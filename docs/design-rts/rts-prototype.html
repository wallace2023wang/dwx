<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rule Team Server — 规则管理控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%231d365d'/%3E%3Ctext x='8' y='12' text-anchor='middle' fill='white' font-size='9' font-family='sans-serif' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E" />
<style>
/* ============ ODM RTS palette (Business Console) ============ */
:root{
  --ibm-blue:#0062ff; --ibm-blue-dark:#1d365d; --ibm-blue-light:#dfe7ee;
  --bg:#f3f3f3; --border:#d0d0d0; --border-light:#e8e8e8;
  --text:#1a1a1a; --text-2:#595959; --text-3:#8c8c8c;
  --green:#2e7d32; --green-bg:#e8f5e9;
  --red:#c62828; --red-bg:#ffebee;
  --amber:#e65100; --amber-bg:#fff3e0;
  --purple:#6a1b9a; --purple-bg:#f3e5f5;
  --side-w:260px; --artlist-w:340px;
  --font:"Helvetica Neue",Helvetica,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:12px;color:var(--text);background:var(--bg);overflow:hidden;line-height:1.45}
button{font-family:inherit;font-size:12px;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:12px}
a{color:var(--ibm-blue);text-decoration:none;cursor:pointer}

/* ============ Top blue banner ============ */
.banner{height:44px;background:var(--ibm-blue-dark);color:#fff;display:flex;align-items:center;padding:0 20px;gap:0}
.banner .prod{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.banner .prod .mark{width:22px;height:22px;background:var(--ibm-blue);border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.banner .crumbs{color:#b8c5d6;font-size:11px;margin-left:24px}
.banner .spacer{flex:1}
.banner .user{display:flex;align-items:center;gap:8px;font-size:12px;color:#d8e0ea}
.banner .avatar{width:24px;height:24px;border-radius:50%;background:var(--ibm-blue);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}

/* ============ Sub tabs (Home/Library) ============ */
.subnav{background:#fff;border-bottom:1px solid var(--border);display:flex;padding:0 20px;height:36px;align-items:stretch}
.subnav button{padding:0 16px;color:var(--text-2);border-bottom:2px solid transparent;font-size:12px}
.subnav button.active{color:var(--ibm-blue);border-bottom-color:var(--ibm-blue);font-weight:500}
.subnav button:hover{color:var(--text)}

/* ============ Project header (inside decision service) ============ */
.proj-head{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px 0}
.proj-head h1{font-size:16px;font-weight:500;display:inline-block;margin-right:16px}
.proj-head .meta{font-size:11px;color:var(--text-3);margin-top:2px}
.proj-tabs{display:flex;gap:0;margin-top:12px}
.proj-tabs button{padding:8px 14px;font-size:12px;color:var(--text-2);border:1px solid transparent;border-bottom:none}
.proj-tabs button.active{background:var(--bg);border-color:var(--border);color:var(--text);font-weight:500;border-radius:3px 3px 0 0}

/* ============ Three column: tree | artifact list | editor ============ */
.three-col{display:flex;height:calc(100vh - 44px - 36px - 0px);background:var(--bg)}
.three-col.with-proj{height:calc(100vh - 44px - 36px - 110px)}
.col{background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.col-tree{width:var(--side-w)}
.col-list{width:var(--artlist-w)}
.col-editor{flex:1;border-right:none;background:#fff;overflow:auto}

.col-head{padding:8px 12px;border-bottom:1px solid var(--border);background:#fafafa;font-size:11px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;align-items:center}
.col-head select{font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:2px}

/* Tree */
.tree{flex:1;overflow:auto;padding:6px 0;font-size:12px}
.tree .node{display:flex;align-items:center;gap:5px;padding:3px 10px;cursor:pointer;color:var(--text)}
.tree .node:hover{background:#eaf2fb}
.tree .node.sel{background:#d6e6f7;border-right:2px solid var(--ibm-blue)}
.tree .tw{width:10px;font-size:9px;color:var(--text-3)}
.tree .ic{width:14px;text-align:center;color:var(--text-3)}
.tree .cnt{margin-left:auto;font-size:10px;color:var(--text-3)}
.tree .lvl1{padding-left:10px}
.tree .lvl2{padding-left:26px}

/* Artifact list table */
.art-list{flex:1;overflow:auto}
table.arts{width:100%;border-collapse:collapse;font-size:12px}
table.arts th{background:#fafafa;text-align:left;padding:6px 10px;font-weight:600;font-size:11px;color:var(--text-2);border-bottom:1px solid var(--border);position:sticky;top:0}
table.arts td{padding:6px 10px;border-bottom:1px solid var(--border-light)}
table.arts tr:hover td{background:#f0f6fc}
table.arts tr.sel td{background:#d6e6f7}
table.arts .nm{color:var(--ibm-blue)}
table.arts .who{color:var(--text-3);font-size:11px}
.st{display:inline-block;font-size:10px;padding:1px 6px;border-radius:2px}
.st.draft{background:var(--amber-bg);color:var(--amber)}
.st.pub{background:var(--green-bg);color:var(--green)}
.st.dep{background:var(--purple-bg);color:var(--purple)}

/* ============ Editor ============ */
.ed-toolbar{padding:8px 16px;border-bottom:1px solid var(--border);background:#fafafa;display:flex;align-items:center;gap:10px}
.ed-toolbar .crumb{font-size:11px;color:var(--text-3)}
.ed-toolbar .crumb b{color:var(--text);font-weight:500}
.ed-title{padding:14px 20px 8px}
.ed-title h2{font-size:15px;font-weight:500;display:inline-block;margin-right:10px}
.ed-meta{padding:0 20px 10px;font-size:11px;color:var(--text-3);display:flex;gap:16px;border-bottom:1px solid var(--border-light);margin:0 20px}

/* BAL editor */
.bal-box{padding:20px 24px;font-size:13px;line-height:2}
.bal-box .kw{color:var(--purple);font-weight:500}
.bal-box .term{color:var(--ibm-blue);border-bottom:1px dotted var(--ibm-blue);cursor:pointer}
.bal-box .term:hover{background:#eaf2fb}
.bal-box .val{font-family:"Courier New",monospace;background:#f5f5f5;padding:1px 6px;border:1px solid var(--border-light);border-radius:2px;cursor:pointer}
.bal-box .indent{display:block;margin-left:24px}
.bal-box .indent2{display:block;margin-left:48px}

/* Properties panel */
.props{display:flex;border-top:1px solid var(--border);background:#fafafa}
.props .pcol{flex:1;padding:10px 20px;font-size:11px}
.props .pcol h4{font-size:10px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;letter-spacing:.04em}
.props .prow{display:flex;justify-content:space-between;padding:2px 0}
.props .prow b{font-weight:500}

/* ============ Buttons ============ */
.btn{padding:5px 12px;border:1px solid var(--border);background:#fff;border-radius:2px;font-size:12px;color:var(--text)}
.btn:hover{background:#f0f0f0}
.btn.primary{background:var(--ibm-blue);color:#fff;border-color:var(--ibm-blue)}
.btn.primary:hover{background:#0052cc}
.btn.sm{padding:2px 8px;font-size:11px}

/* ============ Home / Library views ============ */
.page{padding:20px 24px;height:100%;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:3px;padding:14px;cursor:pointer}
.card:hover{border-color:var(--ibm-blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card .ic{width:32px;height:32px;background:var(--ibm-blue-light);color:var(--ibm-blue-dark);border-radius:3px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.card h3{font-size:13px;font-weight:500;margin-bottom:4px}
.card .sub{font-size:11px;color:var(--text-3)}
.card .stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)}
.card .stats div{font-size:10px;color:var(--text-3)}
.card .stats b{display:block;font-size:14px;color:var(--text);font-weight:500}

/* Table grid (decision table) */
.dt{margin:16px 20px;background:#fff;border:1px solid var(--border);overflow:auto}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border:1px solid var(--border);padding:5px 8px;text-align:left}
table.grid th{background:#f0f0f0;font-weight:600;font-size:11px}
table.grid td input{border:none;outline:none;width:100%}
table.grid td input:focus{background:#eaf2fb}

/* Empty view */
.view{display:none}
.view.active{display:block}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ibm-blue-dark);color:#fff;padding:8px 18px;border-radius:3px;font-size:12px;opacity:0;transition:opacity .2s;z-index:99}
.toast.show{opacity:1}

/* ============ Flow canvas ============ */
.flow-canvas{background:#fff;border:1px solid var(--border);border-radius:3px;height:560px;position:relative;overflow:hidden;background-image:radial-gradient(circle,#e8e8e8 1px,transparent 1px);background-size:18px 18px}
.fnode{position:absolute;background:#fff;border:1.5px solid var(--ibm-blue);border-radius:3px;padding:8px 12px;font-size:11px;min-width:150px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fnode .ft{font-weight:600;font-size:11px}
.fnode .fs{font-size:10px;color:var(--text-3);margin-top:2px}
.fnode.task{border-color:var(--ibm-blue)}
.fnode.gate{border-color:var(--amber);background:#fff8e1;border-radius:16px}
.fnode.end{border-color:var(--green);background:var(--green-bg)}
.fnode.start{border-color:var(--purple);background:var(--purple-bg)}
.fedge{position:absolute;background:var(--text-3);height:1.5px;transform-origin:left center}
.fedge-label{position:absolute;font-size:10px;color:var(--text-3);background:#fff;padding:0 4px}

/* ============ BOM two-col ============ */
.bom-cols{display:grid;grid-template-columns:280px 1fr;gap:14px}
.bom-obj{background:#fff;border:1px solid var(--border);border-radius:3px}
.bom-obj h3{padding:8px 12px;background:#fafafa;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}
.bom-field{padding:6px 12px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;font-size:11px}
.bom-field:last-child{border-bottom:none}
.bom-field .fk{font-family:"Courier New",monospace}
.bom-field .ft{font-size:10px;color:var(--text-3)}
.bom-vocab{background:#fff;border:1px solid var(--border);border-radius:3px}
.bom-vocab table{width:100%;border-collapse:collapse;font-size:12px}
.bom-vocab th{background:#fafafa;text-align:left;padding:6px 10px;font-weight:600;font-size:11px;border-bottom:1px solid var(--border)}
.bom-vocab td{padding:6px 10px;border-bottom:1px solid var(--border-light)}

/* ============ Test suite ============ */
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:12px;border:1px solid var(--border)}
.tbl th{background:#fafafa;text-align:left;padding:8px 10px;font-weight:600;font-size:11px;border-bottom:1px solid var(--border)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-light)}
.tbl tr:last-child td{border-bottom:none}
.pass{color:var(--green);font-weight:500}
.fail{color:var(--red);font-weight:500}
.running{color:var(--amber);font-weight:500}
.ver{font-family:"Courier New",monospace;color:var(--ibm-blue)}

/* ============ Release list ============ */
.env-chip{display:inline-block;padding:1px 8px;border-radius:2px;font-size:10px;margin-right:4px}
.env-prod{background:var(--green-bg);color:var(--green)}
.env-test{background:var(--blue-bg);color:var(--ibm-blue)}
.env-shadow{background:var(--purple-bg);color:var(--purple)}
</style>
</head>
<body>

<!-- ============ Top banner ============ -->
<header class="banner">
  <div class="prod"><div class="mark">R</div> Decision Workbench</div>
  <div class="crumbs" id="crumbs">规则仓库</div>
  <div class="spacer"></div>
  <div class="user" id="userMenu">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <div style="position:relative;cursor:pointer" onclick="toggleUserMenu(event)">
      <span class="avatar">WL</span>
      <div id="userDropdown" style="display:none;position:absolute;right:0;top:32px;background:#fff;color:var(--text);min-width:180px;border:1px solid var(--border);border-radius:3px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:99">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border-light)">
          <div style="font-weight:600;font-size:12px">wallace</div>
          <div style="font-size:11px;color:var(--text-3)">管理员 · wallace@company.com</div>
        </div>
        <div style="padding:4px 0">
          <div style="padding:7px 14px;font-size:12px;cursor:pointer" onmouseover="this.style.background='#f0f6fc'" onmouseout="this.style.background=''" onclick="toast('修改密码')">修改密码</div>
          <div style="padding:7px 14px;font-size:12px;cursor:pointer;color:var(--red)" onmouseover="this.style.background='#ffebee'" onmouseout="this.style.background=''" onclick="doLogout()">退出登录</div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ============ Login screen ============ -->
<div id="loginScreen" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#1d365d 0%,#0f62ff 100%);z-index:200;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:6px;padding:36px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px">
      <div style="width:36px;height:36px;background:var(--ibm-blue);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">R</div>
      <div>
        <div style="font-size:15px;font-weight:600">Decision Workbench</div>
        <div style="font-size:11px;color:var(--text-3)">规则团队管理控制台</div>
      </div>
    </div>
    <label style="font-size:11px;color:var(--text-2);display:block;margin-bottom:4px">用户名</label>
    <input id="loginUser" value="wallace" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:3px;margin-bottom:14px;font-size:13px" />
    <label style="font-size:11px;color:var(--text-2);display:block;margin-bottom:4px">密码</label>
    <input id="loginPass" type="password" value="********" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:3px;margin-bottom:10px;font-size:13px" />
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:20px">
      <label style="display:flex;align-items:center;gap:4px;color:var(--text-2)"><input type="checkbox" checked /> 记住我</label>
      <a style="font-size:11px">忘记密码？</a>
    </div>
    <button class="btn primary" style="width:100%;padding:9px" onclick="doLogin()">登 录</button>
    <div style="margin-top:16px;text-align:center;font-size:10px;color:var(--text-3)">© 2026 规则平台 · v2.1</div>
  </div>
</div>

<!-- ============ Sub nav ============ -->
<nav class="subnav">
  <button data-v="home" class="active">主页</button>
  <button data-v="library">库</button>
  <button data-v="explore">浏览</button>
  <button data-v="admin">管理</button>
</nav>

<!-- ============ Project header (hidden on home/library) ============ -->
<div class="proj-head" id="projHead" style="display:none">
  <h1>Miniloan 贷款审批</h1>
  <span class="st dep">分支: main</span>
  <div class="meta">最近修改: 2026-09-28 16:42 · 陈分析师 · 基线 v2.1.0</div>
  <div class="proj-tabs" id="projTabs">
    <button data-ptab="assets" class="active">资产</button>
    <button data-ptab="flow">规则流</button>
    <button data-ptab="bom">BOM / 词汇</button>
    <button data-ptab="tests">测试套件</button>
    <button data-ptab="releases">发布</button>
  </div>
</div>

<!-- ============ Three column workspace ============ -->
<div class="three-col" id="workspace">

  <!-- Col 1: artifacts tree -->
  <div class="col col-tree" id="colTree">
    <div class="col-head">
      <span>决策资产</span>
      <select><option>所有项目</option></select>
    </div>
    <div class="tree" id="tree"></div>
  </div>

  <!-- Col 2: artifact list -->
  <div class="col col-list" id="colList">
    <div class="col-head">
      <span id="listTitle">全部资产</span>
      <select><option>所有类型</option><option>规则</option><option>决策表</option></select>
    </div>
    <div class="art-list">
      <table class="arts">
        <thead><tr><th>名称</th><th>修改者</th><th>状态</th></tr></thead>
        <tbody id="artRows"></tbody>
      </table>
    </div>
  </div>

  <!-- Col 3: editor -->
  <div class="col col-editor" id="colEditor">
    <div style="padding:40px;text-align:center;color:#8c8c8c">
      <p style="font-size:24px;margin-bottom:8px">📄</p>
      <p>从左侧选择一个规则或决策表开始编辑</p>
    </div>
  </div>
</div>

<!-- ============ Project-level views (flow/bom/tests/releases) ============ -->
<div id="projView" style="display:none;height:calc(100vh - 44px - 36px - 110px);overflow:auto;background:var(--bg);padding:20px 24px"></div>

<div class="toast" id="toast"></div>

<script>
// ===================== Data (miniloan classic BRMS) =====================
const PKGS = [
  {id:'validation', name:'validation 校验', items:[
    {id:'v1', name:'申请人年满 18 岁', type:'规则', who:'陈分析师', st:'pub', ver:'2.1'},
    {id:'v2', name:'贷款金额必须为正', type:'规则', who:'陈分析师', st:'pub', ver:'2.0'},
    {id:'v3', name:'贷款期限合理', type:'规则', who:'wallace', st:'draft', ver:'0.4'},
  ]},
  {id:'eligibility', name:'eligibility 准入', items:[
    {id:'e1', name:'贷款金额不超过年收入 3 倍', type:'规则', who:'陈分析师', st:'pub', ver:'2.3'},
    {id:'e2', name:'信用分达到准入线', type:'决策表', who:'陈分析师', st:'pub', ver:'1.8'},
    {id:'e3', name:'历史逾期次数上限', type:'规则', who:'wallace', st:'draft', ver:'0.9'},
  ]},
  {id:'underwriting', name:'underwriting 承保', items:[
    {id:'u1', name:'风险等级评估', type:'决策表', who:'陈分析师', st:'pub', ver:'3.0'},
    {id:'u2', name:'最终审批结果', type:'规则', who:'陈分析师', st:'pub', ver:'2.2'},
  ]},
];

// ===================== Helpers =====================
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}

// ===================== Login / logout =====================
function toggleUserMenu(e){
  e.stopPropagation();
  const d=$('#userDropdown');
  d.style.display = d.style.display==='none' ? 'block' : 'none';
}
document.addEventListener('click',()=>{const d=$('#userDropdown'); if(d) d.style.display='none'});
function doLogin(){
  $('#loginScreen').style.display='none';
  toast('登录成功，欢迎回来 wallace');
}
function doLogout(){
  $('#userDropdown').style.display='none';
  $('#loginScreen').style.display='flex';
}
function stTag(st){
  if(st==='pub') return '<span class="st pub">已发布</span>';
  if(st==='draft') return '<span class="st draft">草稿</span>';
  return '<span class="st dep">归档</span>';
}

// ===================== Render tree =====================
function renderTree(){
  let html='';
  PKGS.forEach((p,i)=>{
    html+=`<div class="node lvl1" onclick="togglePkg(this)"><span class="tw">▾</span><span class="ic">▸</span><b>${p.name.split(' ')[0]}</b><span class="cnt">${p.items.length}</span></div>`;
    p.items.forEach(it=>{
      const ic = it.type==='决策表'?'▦':'≡';
      html+=`<div class="node lvl2" data-id="${it.id}" onclick="selectArt('${it.id}',this)"><span class="tw"></span><span class="ic">${ic}</span>${it.name}</div>`;
    });
  });
  $('#tree').innerHTML=html;
}
function togglePkg(el){
  const tw=el.querySelector('.tw');
  tw.textContent = tw.textContent==='▾'?'▸':'▾';
  let n=el.nextElementSibling;
  while(n && n.classList.contains('lvl2')){
    n.style.display = tw.textContent==='▾'?'':'none';
    n=n.nextElementSibling;
  }
}

// ===================== Render artifact list (col 2) =====================
function renderList(pkg){
  const p = pkg ? PKGS.find(x=>x.id===pkg) : null;
  $('#listTitle').textContent = p ? p.name : '全部资产';
  const items = p ? p.items : PKGS.flatMap(x=>x.items);
  $('#artRows').innerHTML = items.map(it=>`

// ===================== Select artifact -> editor =====================
function selectArt(id, el){
  document.querySelectorAll('.tree .node').forEach(n=>n.classList.remove('sel'));
  document.querySelectorAll('.art-list tr').forEach(n=>n.classList.remove('sel'));
  if(el) el.classList.add('sel');
  // find in tree
  const treeNode=document.querySelector(`.tree .node[data-id="${id}"]`);
  if(treeNode) treeNode.classList.add('sel');

  // find item
  let item=null, pkgName='';
  for(const p of PKGS){
    const f=p.items.find(x=>x.id===id);
    if(f){item=f; pkgName=p.name; break;}
  }
  if(!item) return;
  $('#crumbs').textContent = `规则仓库 / Miniloan / ${pkgName} / ${item.name}`;

  if(item.type==='决策表') renderTable(item);
  else renderBAL(item);
}

// ===================== Project sub-tabs =====================
function setPtab(tab){
  document.querySelectorAll('#projTabs button').forEach(b=>b.classList.toggle('active',b.dataset.ptab===tab));
  if(tab==='assets'){
    $('#workspace').style.display='flex';
    $('#projView').style.display='none';
    return;
  }
  $('#workspace').style.display='none';
  $('#projView').style.display='block';
  if(tab==='flow') renderFlow();
  else if(tab==='bom') renderBomView();
  else if(tab==='tests') renderTests();
  else if(tab==='releases') renderReleases();
}
document.querySelectorAll('#projTabs button').forEach(b=>{
  b.onclick=()=>setPtab(b.dataset.ptab);
});

        <textarea rows="4" placeholder="本次变更摘要…" style="padding:7px 10px;border:1px solid var(--border);border-radius:3px;font-size:12px">新增"贷款期限合理"规则；调整风险等级表第 5 行优先级</textarea>
        <label style="font-size:12px;color:var(--text-2)">Release 类型</label>
        <div><label style="margin-right:16px;font-size:12px"><input type="radio" name="rt" checked /> 小版本（补丁）</label>
        <label style="margin-right:16px;font-size:12px"><input type="radio" name="rt" /> 次版本（新规则）</label>
        <label style="font-size:12px"><input type="radio" name="rt" /> 主版本（BOM 变更）</label></div>
      </div>`;
  }
  if(relStep===3){
    b.innerHTML=`
      <h3 style="font-size:13px;margin-bottom:12px">编译与测试验证</h3>
      <div style="padding:12px;border:1px solid var(--border-light);border-radius:3px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>✅ Drools DRL 编译</span><span class="pass">通过 · 0 错误 0 警告</span>
        </div>
      </div>
      <div style="padding:12px;border:1px solid var(--border-light);border-radius:3px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>✅ BOM 校验（12 字段）</span><span class="pass">通过 · 无删除/无类型变更</span>
        </div>
      </div>
      <div style="padding:12px;border:1px solid var(--border-light);border-radius:3px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>⚠ 测试套件</span><span class="fail">11/12 通过（场景 5 失败）</span>
        </div>
        <div style="margin-top:8px;font-size:11px;color:var(--red)">场景 5「多次逾期」期望 HIGH 实际 MEDIUM——继续构建将标记为已知问题</div>
      </div>
      <div style="padding:12px;border:1px solid var(--border-light);border-radius:3px">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>✅ 冲突检测</span><span class="pass">无重叠/矛盾规则</span>
        </div>
      </div>`;
  }
  if(relStep===4){
    b.innerHTML=`
      <h3 style="font-size:13px;margin-bottom:12px">部署目标环境</h3>
      <table class="tbl">
        <thead><tr><th style="width:30px"></th><th>环境</th><th>部署策略</th><th>Shadow 对比</th></tr></thead>
        <tbody>
          <tr><td><input type="checkbox" checked onchange="relDraft.targets=this.checked?addT('dev'):delT('dev')"></td><td><span class="env-chip" style="background:#f3e5f5;color:#6a1b9a">dev</span></td><td>自动部署</td><td>—</td></tr>
          <tr><td><input type="checkbox" checked onchange="relDraft.targets=this.checked?addT('test'):delT('test')"></td><td><span class="env-chip env-test">test</span></td><td>自动部署 + 跑测试</td><td>—</td></tr>
          <tr><td><input type="checkbox" onchange="relDraft.targets=this.checked?addT('staging'):delT('staging')"></td><td><span class="env-chip" style="background:#fff3e0;color:#e65100">staging</span></td><td>手动部署</td><td>☑ 对比当前 prod</td></tr>
          <tr><td><input type="checkbox" onchange="relDraft.targets=this.checked?addT('prod'):delT('prod')"></td><td><span class="env-chip env-prod">production</span></td><td>双人审批</td><td>☑ 并行影子</td></tr>
        </tbody>
      </table>
      <div style="margin-top:10px;font-size:11px;color:var(--text-3)">勾选 production 需指定第二位审批人；未审批前不会真正上线。</div>`;
  }
  if(relStep===5){
    b.innerHTML=`
      <h3 style="font-size:13px;margin-bottom:16px">确认构建 v${relDraft.version}</h3>
      <table class="tbl" style="max-width:640px">
        <tr><td style="width:160px;color:var(--text-3)">版本号</td><td class="ver">v${relDraft.version}</td></tr>
        <tr><td style="color:var(--text-3)">包含资产</td><td>8 个（validation 3 · eligibility 3 · underwriting 2）</td></tr>
        <tr><td style="color:var(--text-3)">发布说明</td><td>新增"贷款期限合理"；调整风险等级表第 5 行</td></tr>
        <tr><td style="color:var(--text-3)">编译</td><td><span class="pass">通过</span></td></tr>
        <tr><td style="color:var(--text-3)">测试</td><td><span class="fail">11/12 通过（场景 5 已知问题）</span></td></tr>
        <tr><td style="color:var(--text-3)">部署到</td><td>${['dev','test','staging','prod'].filter(t=>relDraft.targets.includes(t)).map(t=>`<span class="env-chip env-test">${t}</span>`).join(' ')}</td></tr>
        <tr><td style="color:var(--text-3)">校验和</td><td style="font-family:Courier New;font-size:11px">sha256: a3f9…e21c（构建后生成）</td></tr>
      </table>
      <div style="margin-top:16px;padding:10px;background:#fff8e1;border:1px solid #ffe082;border-radius:3px;font-size:11px">
        ⚠ 测试套件有 1 个未通过场景。继续构建将把该问题标记为已知问题，并要求测试负责人签字确认。
      </div>`;
  }
}
function pName(it){ for(const p of PKGS){ if(p.items.find(x=>x.id===it.id)) return p.name; } return ''; }
function addT(t){ relDraft.targets.push(t); }
function delT(t){ relDraft.targets=relDraft.targets.filter(x=>x!==t); }
function wizardNext(){
  if(relStep<5){ relStep++; renderReleaseWizard(); }
  else { toast(`Release v${relDraft.version} 构建成功，已部署到 ${relDraft.targets.join(', ')}`); setTimeout(renderReleases, 1200); }
}
